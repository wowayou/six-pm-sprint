    <text x="86" y="29" fill="#f6f2e8" font-family="system-ui, sans-serif" font-size="26" font-weight="900">六点夺秒</text>
    <text x="86" y="54" fill="#8f87a2" font-family="monospace" font-size="11" font-weight="700" letter-spacing="3">SIX PM SPRINT</text>
